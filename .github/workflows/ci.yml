name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check:release

      - name: Run headless component interaction simulation (333 clicks)
        run: npm run simulate:clicks

      - name: Run cloud function architecture & security check (56 functions)
        run: node scripts/cloudCheck.js

      - name: Run end-to-end real user scenario validation (30 scenarios)
        run: node scripts/verifyActualUsage.js
